    let currentIndex = 0;
    let score = 0;
    let shuffledData = [];

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function initGame() {
        shuffledData = shuffle([...quizData]);
        currentIndex = 0;
        score = 0;
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= shuffledData.length) {
            document.querySelector(".container").innerHTML = `
                <h1>🎉 Quiz Completed!</h1>
                <p style="text-align: center; font-size: 18px;">Your final score is: <strong>${score} / ${shuffledData.length}</strong></p>
                <button onclick="location.reload()">Play Again</button>
            `;
            return;
        }

        const currentQ = shuffledData[currentIndex];
        document.getElementById("vietnameseSentence").innerText = `(${currentQ.vi})`;
        document.getElementById("userAnswer").value = "";
        document.getElementById("feedback").style.display = "none";
        document.getElementById("submitBtn").innerText = "Submit Answer";
        document.getElementById("submitBtn").onclick = checkAnswer;
        
        document.getElementById("progress").innerText = `Question: ${currentIndex + 1} / ${shuffledData.length}`;
        document.getElementById("stats").innerText = `Score: ${score} | Remaining: ${shuffledData.length - currentIndex}`;
        
        document.getElementById("userAnswer").focus();
    }

    function checkAnswer() {
        const userIn = document.getElementById("userAnswer").value.trim();
        const currentQ = shuffledData[currentIndex];
        const feedbackDiv = document.getElementById("feedback");

        if (!userIn) {
            alert("Please type a German sentence first!");
            return;
        }

        if (userIn === currentQ.de) {
            feedbackDiv.className = "feedback correct";
            feedbackDiv.innerText = "✅ Correct!";
            score++;
        } else {
            feedbackDiv.className = "feedback incorrect";
            feedbackDiv.innerHTML = `❌ Incorrect!\n\nCorrect German sentence:\n<strong>${currentQ.de}</strong>`;
        }

        feedbackDiv.style.display = "block";
        
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.innerText = "Next Question ➡️";
        submitBtn.onclick = () => {
            currentIndex++;
            loadQuestion();
        };
    }

    initGame();
</script>
